<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="دورة التجارة بين وكلاء الذكاء الاصطناعي">
  <defs>
    <linearGradient id="cg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5cff"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/><stop offset="1" stop-color="#eef3ff" stop-opacity=".65"/>
    </linearGradient>
    <radialGradient id="cglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".4"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="360" cy="240" r="230" fill="url(#cglow)"/>
  <circle cx="360" cy="240" r="170" fill="none" stroke="url(#cg1)" stroke-width="2" stroke-opacity=".4" stroke-dasharray="8 10"/>
  <circle cx="360" cy="240" r="120" fill="none" stroke="#6d5cff" stroke-width="1.5" stroke-opacity=".25"/>

  <!-- rotating packet -->
  <circle r="7" fill="#6d5cff"><animateMotion dur="6s" repeatCount="indefinite" path="M360 70 a170 170 0 1 1 -0.1 0"/></circle>
  <circle r="6" fill="#34d399"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M360 70 a170 170 0 1 1 -0.1 0"/></circle>

  <!-- center -->
  <circle cx="360" cy="240" r="64" fill="url(#cg2)" stroke="url(#cg1)" stroke-width="3"/>
  <path d="M338 252 L352 252 L360 226 L368 252 L382 252" fill="none" stroke="url(#cg1)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="336" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="900" font-size="20" fill="#141a33">منصة تقدّم</text>

  <!-- orbit nodes -->
  <g>
    <circle cx="360" cy="70" r="40" fill="url(#cg2)" stroke="#6d5cff" stroke-width="2.5"/>
    <path d="M346 76 l10 10 l18 -22" fill="none" stroke="#6d5cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -2)"/>
    <text x="360" y="30" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="15" font-weight="700" fill="#3c4566">اكتشاف</text>
  </g>
  <g>
    <circle cx="530" cy="240" r="40" fill="url(#cg2)" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M516 240 h28 M530 226 v28" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <text x="530" y="196" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="15" font-weight="700" fill="#3c4566">تفاوض</text>
  </g>
  <g>
    <circle cx="360" cy="410" r="40" fill="url(#cg2)" stroke="#34d399" stroke-width="2.5"/>
    <rect x="346" y="396" width="28" height="22" rx="5" fill="none" stroke="#34d399" stroke-width="3"/>
    <path d="M351 396 v-6 a9 9 0 0 1 18 0 v6" fill="none" stroke="#34d399" stroke-width="3"/>
    <text x="360" y="470" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="15" font-weight="700" fill="#3c4566">عقد ذكي</text>
  </g>
  <g>
    <circle cx="190" cy="240" r="40" fill="url(#cg2)" stroke="#c084fc" stroke-width="2.5"/>
    <circle cx="190" cy="240" r="12" fill="none" stroke="#c084fc" stroke-width="3"/>
    <path d="M190 222 v-6 M190 264 v-6 M172 240 h-6 M214 240 h-6" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <text x="190" y="196" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="15" font-weight="700" fill="#3c4566">تسوية</text>
  </g>
</svg>
