<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="شبكة وكلاء ذكاء اصطناعي يتبادلون معاملات تجارية">
  <defs>
    <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5cff"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="hg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#eef3ff" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="hglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6d5cff" stop-opacity=".55"/><stop offset="1" stop-color="#6d5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hglow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- ambient glows -->
  <circle cx="180" cy="140" r="180" fill="url(#hglow)"/>
  <circle cx="560" cy="420" r="200" fill="url(#hglow2)"/>
  <circle cx="540" cy="110" r="120" fill="#34d399" opacity=".22" filter="url(#blur30)"/>

  <!-- connection lines -->
  <g stroke="url(#hg1)" stroke-width="2.5" stroke-opacity=".55" fill="none">
    <path d="M360 280 L180 150"/>
    <path d="M360 280 L560 150"/>
    <path d="M360 280 L150 400"/>
    <path d="M360 280 L570 400"/>
    <path d="M180 150 L560 150" stroke-dasharray="6 8"/>
    <path d="M150 400 L570 400" stroke-dasharray="6 8"/>
  </g>

  <!-- data packets -->
  <circle r="7" fill="#6d5cff"><animateMotion dur="3.4s" repeatCount="indefinite" path="M360 280 L180 150"/></circle>
  <circle r="7" fill="#38bdf8"><animateMotion dur="3s" begin="-1s" repeatCount="indefinite" path="M560 150 L360 280"/></circle>
  <circle r="6" fill="#34d399"><animateMotion dur="3.8s" begin="-.6s" repeatCount="indefinite" path="M360 280 L570 400"/></circle>
  <circle r="6" fill="#c084fc"><animateMotion dur="3.2s" begin="-2s" repeatCount="indefinite" path="M150 400 L360 280"/></circle>

  <!-- central core: Super AI -->
  <circle cx="360" cy="280" r="86" fill="url(#hglow)"/>
  <circle cx="360" cy="280" r="72" fill="url(#hg2)" stroke="url(#hg1)" stroke-width="3"/>
  <circle cx="360" cy="280" r="58" fill="none" stroke="#6d5cff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 6"/>
  <g transform="translate(360 280)">
    <path d="M-22 14 L-8 14 L0 -16 L8 14 L22 14" fill="none" stroke="url(#hg1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="-16" r="6" fill="#38bdf8"/>
  </g>
  <text x="360" y="388" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="900" font-size="22" fill="#141a33">Super AI</text>

  <!-- agent nodes -->
  <g>
    <circle cx="180" cy="150" r="52" fill="url(#hglow2)"/>
    <circle cx="180" cy="150" r="42" fill="url(#hg2)" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M168 150 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="180" cy="150" r="4" fill="#38bdf8"/>
  </g>
  <g>
    <circle cx="560" cy="150" r="52" fill="url(#hglow)"/>
    <circle cx="560" cy="150" r="42" fill="url(#hg2)" stroke="#6d5cff" stroke-width="2.5"/>
    <rect x="547" y="137" width="26" height="26" rx="7" fill="none" stroke="#6d5cff" stroke-width="3"/>
    <circle cx="560" cy="150" r="4" fill="#6d5cff"/>
  </g>
  <g>
    <circle cx="150" cy="400" r="52" fill="#34d399" opacity=".18"/>
    <circle cx="150" cy="400" r="42" fill="url(#hg2)" stroke="#34d399" stroke-width="2.5"/>
    <path d="M138 400 l8 8 l16 -16" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="570" cy="400" r="52" fill="#c084fc" opacity=".2"/>
    <circle cx="570" cy="400" r="42" fill="url(#hg2)" stroke="#c084fc" stroke-width="2.5"/>
    <path d="M558 388 h24 v18 h-24 z M562 388 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="180" y="222" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="15" font-weight="700" fill="#3c4566">وكيل مورّد</text>
  <text x="560" y="222" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="15" font-weight="700" fill="#3c4566">وكيل مشترٍ</text>
  <text x="150" y="472" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="15" font-weight="700" fill="#3c4566">تسوية فورية</text>
  <text x="570" y="472" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="15" font-weight="700" fill="#3c4566">عقد آمن</text>

  <!-- floating chips -->
  <g>
    <rect x="96" y="252" width="150" height="46" rx="23" fill="url(#hg2)" stroke="#6d5cff" stroke-opacity=".4"/>
    <circle cx="122" cy="275" r="9" fill="url(#hg1)"/>
    <text x="206" y="281" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="15" font-weight="700" fill="#141a33">صفقة ذكية</text>
  </g>
  <g>
    <rect x="478" y="252" width="160" height="46" rx="23" fill="url(#hg2)" stroke="#38bdf8" stroke-opacity=".4"/>
    <circle cx="504" cy="275" r="9" fill="#38bdf8"/>
    <text x="552" y="281" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="15" font-weight="700" fill="#141a33">تفاوض تلقائي</text>
  </g>
</svg>
